<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Árbitros — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script>
    (function () {
      const t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
<button class="theme-toggle login-theme-toggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <span class="icon">⚽</span>
      <h1>Gestión de Árbitros</h1>
      <p>Ingresá con tu cuenta</p>
    </div>

    <div class="login-error" id="loginError"></div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" id="email" class="form-input" placeholder="admin@arbitros.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn btn-primary" style="width:100%;margin-top:4px" id="loginBtn" onclick="doLogin()">
      Ingresar
    </button>
  </div>
</div>

<script>
  if (localStorage.getItem('access_token')) window.location.href = '/dashboard';

  async function doLogin() {
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    err.style.display = 'none';
    btn.textContent = 'Ingresando...';
    btn.disabled = true;
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email:    document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      if (!r.ok) { const e = await r.json(); throw new Error(e.detail || 'Error'); }
      const data = await r.json();
      localStorage.setItem('access_token',  data.access_token);
      localStorage.setItem('refresh_token', data.refresh_token);
      localStorage.setItem('usuario',       JSON.stringify(data.usuario));
      window.location.href = '/dashboard';
    } catch (e) {
      err.textContent = e.message;
      err.style.display = 'block';
      btn.textContent = 'Ingresar';
      btn.disabled = false;
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
<script src="js/theme.js"></script>
</body>
</html>
